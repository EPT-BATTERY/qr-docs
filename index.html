<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>EPT Battery · Compliance Documents</title>
<meta name="description" content="EU compliance document pages for EPT rechargeable lithium-ion battery packs.">
<style>
  :root{
    --ink:#122a3f; --ink-2:#41586e; --ink-3:#78899a;
    --line:#e3eaf1; --bg:#f2f6f9; --card:#fff;
    --accent:#0d6d5b; --accent-soft:#e8f4f1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
    font-size:14.5px;line-height:1.62;-webkit-font-smoothing:antialiased}
  .wrap{max-width:800px;margin:0 auto;padding:0 16px}
  .hero{color:#fff;padding:34px 0 38px;
    background:radial-gradient(120% 120% at 88% -10%, #16896f 0%, rgba(22,137,111,0) 55%),
      linear-gradient(155deg,#0c2436 0%,#123c4d 55%,#0d5a52 100%)}
  .kicker{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:#9fd8c9;
    font-weight:700;margin-bottom:11px;display:inline-flex;align-items:center;gap:7px}
  .kicker:before{content:"";width:18px;height:1px;background:#9fd8c9}
  .hero h1{margin:0;font-size:24px;line-height:1.3;font-weight:700}
  .hero p{margin:8px 0 0;color:#c3d9d5;font-size:13px}
  section{padding:24px 0 4px}
  .list{display:flex;flex-direction:column;gap:10px;margin-top:4px}
  a.item{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;text-decoration:none;color:inherit;box-shadow:0 1px 2px rgba(18,42,63,.04)}
  a.item .m{font-size:15px;font-weight:700;color:var(--ink)}
  a.item .d{font-size:12.5px;color:var(--ink-2);margin-top:3px}
  a.item .t{display:inline-block;margin-top:8px;font-size:11px;color:var(--accent);
    background:var(--accent-soft);padding:2px 9px;border-radius:999px}
  footer{padding:26px 0 40px;color:var(--ink-3);font-size:11.5px;text-align:center}
</style>
</head>
<body>
<div class="hero"><div class="wrap">
  <div class="kicker">Compliance Documents</div>
  <h1>EPT Battery</h1>
  <p>Shenzhen EPT Battery Co., Ltd. — EU compliance document pages. Scan the QR code on the battery label to view.</p>
</div></div>

<main class="wrap">
  <section>
    <div class="list" id="list"></div>
  </section>
</main>

<footer>Shenzhen EPT Battery Co., Ltd.<br>www.ept-battery.com</footer>

<script>
var DOCS = [
  {slug:'sx18650-2s1pc-7.3v', model:'SX18650-2S1PC · 3500mAh 7.3V',
   desc:'Rechargeable Li-ion Battery Pack 7.3V 3500mAh 25.55Wh · Product Information & EU Declaration of Conformity (EU) 2023/1542 · 25 languages',
   tag:'EU Compliance'},

  {slug:'18650-3500mah-3.7v', model:'EPT 18650 · 3500mAh 3.7V',
   desc:'Rechargeable Li-ion Battery 3.7V 3500mAh 12.95Wh · Product Information & EU Declaration of Conformity (EU) 2023/1542 · 25 languages',
   tag:'EU Compliance'},

  {slug:'18500-1600mah-3.7v', model:'18500 · 1600mAh 3.7V',
   desc:'Cylindrical Lithium-ion Battery 3.7V 1600mAh 5.92Wh · Battery Information & EU Declaration of Conformity (EU) 2023/1542 · editable batch serial number with live vector QR',
   tag:'EU Compliance'},

  {slug:'705048-2000mah-3.7v', model:'705048 · Li-ion 2000mAh',
   desc:'Rechargeable Li-ion Battery Pack 3.7V 2000mAh 7.4Wh · EU Declaration of Conformity, SDS Report & Article 74 waste battery guidance (EU) 2023/1542',
   tag:'EU Compliance'},
  {slug:'sc11-14430-600', model:'SC11 · 14430 600mAh',
   desc:'Cylindrical Li-ion Cell · EU Declaration of Conformity, SDS Report & Article 74 waste battery guidance (EU) 2023/1542',
   tag:'EU Compliance'},
  {slug:'r2412-4s2p-lnyd', model:'R2412-4S2P-LNYD',
   desc:'Rechargeable Lithium-ion Battery Pack · EU Declaration of Conformity (EU) 2023/1542 & battery information',
   tag:'EU Compliance'}
];
var list = document.getElementById('list');
DOCS.forEach(function(d){
  var a = document.createElement('a');
  a.className = 'item';
  a.href = d.slug + '/';
  a.innerHTML = '<div class="m">' + d.model + '</div>' +
                '<div class="d">' + d.desc + '</div>' +
                '<span class="t">' + d.tag + '</span>';
  list.appendChild(a);
});
</script>
</body>
</html>
